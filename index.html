<!DOCTYPE html>
<html lang="ja">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
  <link href="color.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>
  <script type="module">
    import '@material/web/all.js';
    import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';

    document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
  </script>

  <style>
    * {
      font-family: "Google Sans Flex", sans-serif;
      box-sizing: border-box;
    }

    body {
      background: var(--md-sys-color-surface);
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* スライドの表示エリア */
    #deck {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 各スライドの設定 */
    .step {
      position: absolute;
      width: 80%;
      max-width: 800px;
      text-align: center;
      
      /* アニメーションの基本状態（非表示） */
      opacity: 0;
      transform: scale(0.9); 
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
      pointer-events: none;
    }

    /* 表示中の状態 */
    .step.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* ナビゲーションボタン */
    .nav-container {
      position: fixed;
      right: 24px;
      bottom: 24px;
      display: flex;
      gap: 12px;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div id="deck">
    <div class="step active">
      <h1 class="md-typescale-display-large">Slide 1</h1>
      <p class="md-typescale-body-large">シンプルなズームアニメーション</p>
    </div>

    <div class="step">
      <h1 class="md-typescale-display-medium">Slide 2</h1>
      <p>HTMLで自由にリストやボタンを配置できます。</p>
      <md-filled-button>Material 3 Button</md-filled-button>
    </div>

    <div class="step"><h1>Slide 3</h1><p>内容をここに追加...</p></div>
    <div class="step"><h1>Slide 4</h1></div>
    <div class="step"><h1>Slide 5</h1></div>
    <div class="step"><h1>Slide 6</h1></div>
    <div class="step"><h1>Slide 7</h1></div>
    <div class="step"><h1>Slide 8</h1></div>
    <div class="step"><h1>Slide 9</h1></div>
    <div class="step"><h1>Slide 10</h1><p>おわり</p></div>
  </div>

  <div class="nav-container">
    <md-filled-tonal-icon-button id="prev-btn">
      <span class="material-symbols-outlined">
arrow_back
</span>
    </md-filled-tonal-icon-button>
    <md-filled-tonal-icon-button id="next-btn">
      <span class="material-symbols-outlined">
arrow_forward
</span>
    </md-filled-tonal-icon-button>
    
  </div>

  <script>
    const steps = document.querySelectorAll('.step');
    let currentIndex = 0;

    function updateSlide(newIndex) {
      // 現在のスライドを非表示に
      steps[currentIndex].classList.remove('active');
      
      // インデックス更新
      currentIndex = (newIndex + steps.length) % steps.length;
      
      // 次のスライドを表示
      steps[currentIndex].classList.add('active');
    }

    document.getElementById('prev-btn').onclick = () => updateSlide(currentIndex - 1);
    document.getElementById('next-btn').onclick = () => updateSlide(currentIndex + 1);

    // キーボード操作
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') updateSlide(currentIndex - 1);
      if (e.key === 'ArrowRight') updateSlide(currentIndex + 1);
    });
  </script>
</body>
</html>
